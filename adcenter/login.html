<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAKENOV 비즈센터</title>
<link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fb;font-family:'Noto Sans KR',sans-serif;color:#22263a}
.box{width:380px;max-width:calc(100% - 32px);background:#fff;border-radius:20px;padding:40px 32px 36px;box-shadow:0 10px 40px rgba(24,22,48,.06);margin:48px 0}
.lang{display:flex;justify-content:flex-end}
.lang select{border:1px solid #e3e5ef;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#22263a;background:#fff}
.mark{width:48px;height:48px;border-radius:12px;background:#022e7d;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:8px auto 14px}
h1{font-size:18px;text-align:center;margin:0}
.sub{text-align:center;font-size:13px;color:#70738a;margin:6px 0 28px}
input[type=email],input[type=password]{width:100%;height:48px;border:1px solid #e3e5ef;border-radius:12px;padding:0 14px;font-size:15px;margin-bottom:14px;background:#fafbfd;font-family:inherit}
.keep{font-size:13px;color:#4b4f66;display:flex;align-items:center;gap:6px;margin:2px 0 18px}
.btn{width:100%;height:48px;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.btn-main{background:#1faf8a;color:#fff}
.or{display:flex;align-items:center;gap:10px;font-size:12px;color:#8d91a9;margin:18px 0 12px}
.or:before,.or:after{content:'';flex:1;height:1px;background:#eceef4}
.kakao{background:#fee500;color:#191919}.naver{background:#03c75a;color:#fff}
.google,.fb{background:#fff;border:1px solid #e3e5ef;color:#22263a}
.join{text-align:center;font-size:13px;color:#70738a;margin-top:16px}
.join a{color:#1faf8a;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<form class="box" onsubmit="location.href='index.html';return false;">
  <div class="lang"><select><option>한국어</option><option>Tiếng Việt</option><option>English</option></select></div>
  <div class="mark">M</div>
  <h1>MAKENOV 비즈센터</h1>
  <div class="sub">든든한 해외영업 파트너, 메이크노브</div>
  <input type="email" placeholder="이메일 주소">
  <input type="password" placeholder="비밀번호">
  <label class="keep"><input type="checkbox"> 로그인 상태 유지</label>
  <button class="btn btn-main" type="submit">로그인</button>
  <div class="or">간편 로그인</div>
  <button class="btn kakao" type="button" onclick="location.href='index.html'">카카오로 로그인</button>
  <button class="btn naver" type="button" onclick="location.href='index.html'">네이버로 로그인</button>
  <button class="btn google" type="button" onclick="location.href='index.html'">Google로 로그인</button>
  <div class="join">계정이 필요하신가요? <a href="../biz/index.html#apply">상담 신청</a></div>
  <div class="join" style="margin-top:8px"><a href="../biz/index.html">비즈센터 소개 보기</a></div>
</form>
</body>
</html>
