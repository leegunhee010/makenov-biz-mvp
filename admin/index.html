<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>메이크노브 관리자</title>
<link rel="icon" href="../biz/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
<style>
:root{--pri:#27CAA1;--pri-d:#1FAF8A;--pri-dd:#16876b;--pri-soft:#E9FAF5;--mint:#3FE9C0;--navy:#022E7D;--navy-dd:#04143F;--ink:#16181d;--body:#4b4f5c;--muted:#8a8f9c;--line:#e8ebf0;--bg:#f5f6fa;--warn:#f59f0b;--red:#e5484d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;font-size:14px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px}
.side{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--navy-dd);color:#fff;display:flex;flex-direction:column;z-index:20}
.side .brand{display:flex;align-items:center;gap:10px;padding:22px 22px 26px}
.side .brand .m{width:34px;height:34px;border-radius:10px;background:var(--mint);color:var(--navy-dd);display:flex;align-items:center;justify-content:center;font-weight:900}
.side .brand b{display:block;font-size:16px;font-weight:800;letter-spacing:.02em}
.side .brand small{display:block;font-size:11.5px;color:rgba(255,255,255,.55)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.side nav a{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:10px;color:rgba(255,255,255,.72);font-weight:600}
.side nav a i{font-size:19px}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav a.on{background:var(--pri);color:#fff}
.side nav a .bd{margin-left:auto;background:var(--warn);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;padding:16px 22px 22px;font-size:11.5px;color:rgba(255,255,255,.45);line-height:1.6}
.main{margin-left:232px;min-height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;height:64px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;font-weight:800}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri-dd)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.red{color:var(--red)}
.btn.red:hover{border-color:var(--red);color:var(--red)}
.wrap{padding:28px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.kpi small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:28px;font-weight:800;margin-top:6px}
.kpi.warn b{color:var(--warn)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.card-h h2 i{color:var(--pri-d);font-size:19px}
.card-h .sp{flex:1}
.card-b{padding:18px 20px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;border-bottom:1px solid #f0f2f6;text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:#fafbfd;white-space:nowrap}
td{font-size:13.5px}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
td.act{white-space:nowrap;text-align:right}
td.act .btn+.btn{margin-left:4px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.bdg{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.bdg.requested{background:#fff1e0;color:#b25e00}
.bdg.pending{background:#fff4e2;color:#a85b00}
.bdg.confirmed{background:#e8eefb;color:var(--navy)}
.bdg.done{background:#e3f8f0;color:var(--pri-dd)}
.bdg.canceled{background:#f1f2f6;color:var(--muted)}
.bdg.new{background:#fde8e8;color:var(--red)}
.bdg.ok{background:#e3f8f0;color:var(--pri-dd)}
.bdg.mute{background:#f1f2f6;color:var(--muted)}
.seg{display:inline-flex;background:#f1f3f7;border-radius:10px;padding:4px;gap:2px}
.seg button{border:0;background:none;height:32px;padding:0 14px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(4,20,63,.08)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
select.in,input.in{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.big{font-size:40px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.plus{color:var(--pri-dd);font-weight:700}
.minus{color:var(--red);font-weight:700}
.link{color:var(--pri-dd);font-weight:700}
.link:hover{text-decoration:underline}
/* 모달 */
.mask{position:fixed;inset:0;background:rgba(4,20,63,.45);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow-y:auto}
.mask.on{display:flex}
.modal{width:100%;max-width:620px;background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(4,20,63,.3)}
.modal .mh{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:17px;font-weight:800}
.modal .mh .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.modal .mb{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .f{display:flex;flex-direction:column;gap:6px}
.modal .f.full{grid-column:1 / -1}
.modal .f label{font-size:12.5px;font-weight:700;color:var(--body)}
.modal .f input,.modal .f select,.modal .f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafbfd;width:100%}
.modal .f textarea{min-height:90px;resize:vertical;line-height:1.6}
.modal .f input:focus,.modal .f select:focus,.modal .f textarea:focus{outline:0;border-color:var(--pri);background:#fff}
.modal .f .hint{font-size:11.5px;color:var(--muted)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line)}
/* 알림 */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#0b1638;color:#fff;border-radius:14px;padding:13px 20px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 18px 44px rgba(4,20,63,.32);opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast i{color:var(--mint);font-size:20px}

/* 목록 도구 */
.lbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:#fcfcfe}
.sbox{position:relative;display:flex;align-items:center}
.sbox i{position:absolute;left:11px;color:var(--muted);font-size:16px;pointer-events:none}
.sbox input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 34px;width:270px;background:#fff}
.sbox input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(39,202,161,.14)}
.fsel{max-width:180px}
.fsel.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-dd);font-weight:700}
.cnt{font-size:13px;color:var(--muted)}
.cnt b{color:var(--ink);font-size:15px}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--navy);color:#fff}
.bulk b{margin-right:6px}
.bulk .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.bulk .btn:hover{background:#fff;color:var(--navy)}
.bulk .btn.pri{background:var(--pri);border-color:var(--pri)}
.bulk .btn.red{color:#ffb3b5}
.tw{overflow-x:auto}
th.srt{cursor:pointer;user-select:none}
th.srt i{font-size:13px;margin-left:4px;opacity:.35;vertical-align:-1px}
th.srt:hover{color:var(--ink)}
th.srt.on{color:var(--pri-dd)}
th.srt.on i{opacity:1}
th.ck,td.ck{width:40px;padding-right:0}
th.ck input,td.ck input{width:16px;height:16px;accent-color:var(--pri-d);cursor:pointer}
tr.sel td{background:#f2fbf8}
tbody tr:hover td{background:#fafbfd}
tbody tr.sel:hover td{background:#e9f8f3}
td.wide{max-width:360px;min-width:220px;line-height:1.55}
mark{background:#fff0a8;color:inherit;border-radius:3px;padding:0 1px}
.pager{display:flex;align-items:center;gap:4px;padding:12px 20px;border-top:1px solid var(--line)}
.pager select{height:32px;font-size:12.5px}
.pgn{min-width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700;color:var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.pgn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pgn:disabled{opacity:.35;cursor:default}
.empty i{display:block;font-size:30px;margin-bottom:8px;color:#c4c9d4}
.kpi{font-family:inherit;text-align:left;cursor:pointer;transition:.15s;display:block;width:100%}
.kpi:hover{border-color:var(--pri);transform:translateY(-2px)}
.kpi span{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--pri-dd);font-weight:700;margin-top:6px;opacity:0;transition:.15s}
.kpi:hover span{opacity:1}
div.kpi{cursor:default}div.kpi:hover{transform:none;border-color:var(--line)}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:800}
.pill.ok{background:#e3f8f0;color:var(--pri-dd)}
.pill.warn{background:#fff1e0;color:#b25e00}
.bdg.plan{background:#eef2fb;color:var(--navy)}
.seg em{font-style:normal;font-size:11.5px;opacity:.6;margin-left:2px}
/* 통합 검색 */
.gsw{position:relative;display:flex;align-items:center;margin-left:16px}
.gsw > i{position:absolute;left:12px;color:var(--muted);font-size:17px}
.gsw input{height:40px;width:420px;border:1px solid var(--line);border-radius:12px;padding:0 40px 0 38px;background:var(--bg)}
.gsw input:focus{outline:0;background:#fff;border-color:var(--pri);box-shadow:0 0 0 3px rgba(39,202,161,.14)}
.gsw kbd{position:absolute;right:10px;font-family:inherit;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#fff}
#gs-r{position:absolute;top:48px;left:0;width:520px;max-height:70vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px rgba(4,20,63,.16);padding:8px;display:none;z-index:30}
#gs-r.on{display:block}
#gs-r .gh{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;font-size:12px;font-weight:800;color:var(--muted)}
#gs-r .gh em{font-style:normal;color:var(--pri-dd)}
#gs-r .gh button{margin-left:auto;border:0;background:none;color:var(--pri-dd);font-weight:700;font-size:12px;cursor:pointer}
#gs-r .gi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;font-family:inherit}
#gs-r .gi:hover{background:var(--pri-soft)}
#gs-r .gi b{font-size:14px;font-weight:700}
#gs-r .gi small{font-size:12px;color:var(--muted);white-space:nowrap}
#gs-r .ge{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:1300px){.gsw input{width:300px}}
@media(max-width:860px){.gsw{margin:0;width:100%}.gsw input{width:100%}#gs-r{width:100%}.sbox input{width:100%}.sbox{flex:1;min-width:200px}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:860px){.side{position:static;width:auto}.side nav{flex-direction:row;overflow-x:auto;padding-bottom:10px}.side nav a{white-space:nowrap}.side .foot{display:none}.main{margin-left:0}.top{position:static;flex-wrap:wrap;height:auto;padding:14px 16px}.wrap{padding:16px}.card{overflow-x:auto}table{min-width:640px}.modal .mb{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="m">M</span><div><b>MAKENOV</b><small>관리자 · 시연용</small></div></div>
  <nav id="nav"></nav>
  <div class="foot">이 관리자는 시연용입니다. 바꾼 내용은 이 브라우저에만 저장되고, 같은 브라우저의 비즈센터에 바로 반영됩니다.</div>
</aside>
<div class="main">
  <div class="top">
    <h1 id="title">대시보드</h1>
    <div class="gsw"><i class="ti ti-search"></i><input id="gs" type="search" placeholder="고객사, 파트너, 미팅, 회의록, 상담 신청 통합 검색" autocomplete="off"><kbd>/</kbd><div id="gs-r"></div></div>
    <div class="sp"></div>
    <a class="btn" href="../adcenter/index.html" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>비즈센터 열기</a>
    <a class="btn" href="../biz/index.html" target="_blank" rel="noopener"><i class="ti ti-world"></i>소개 사이트</a>
    <button class="btn red" type="button" id="reset"><i class="ti ti-refresh"></i>시연 데이터 초기화</button>
  </div>
  <div class="wrap" id="view"></div>
</div>
<div class="mask" id="mask"><div class="modal"><div class="mh"><h3 id="m-title"></h3><button class="x" type="button" data-close>&times;</button></div><form id="m-form"><div class="mb" id="m-body"></div><div class="mf"><button class="btn" type="button" data-close>닫기</button><button class="btn pri" type="submit">저장</button></div></form></div></div>
<div id="toast"><i class="ti ti-circle-check-filled"></i><span></span></div>
<script src="../adcenter/assets/js/mkdata.js"></script>
<script src="admin.js"></script>
</body>
</html>
